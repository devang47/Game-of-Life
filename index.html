<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Game of Life</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #22242a;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: crosshair;
        touch-action: manipulation;
      }
      .speed {
        position: fixed;
        right: max(16px, env(safe-area-inset-right));
        bottom: max(16px, env(safe-area-inset-bottom));
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        padding: 0 12px;
        border: 1px solid rgb(255 255 255 / 0.12);
        border-radius: 8px;
        background: #22242a;
        color: #bdc1c6;
        color-scheme: dark;
        font: 13px/1 system-ui, sans-serif;
      }
      .speed input {
        width: 120px;
        height: 44px;
        margin: 0;
        accent-color: #f3f8fa;
        cursor: pointer;
      }
      .speed input:focus-visible {
        outline: 2px solid #f3f8fa;
        outline-offset: 2px;
      }
      .speed output {
        min-width: 4ch;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <canvas role="img" aria-label="Conway's Game of Life. Click anywhere to add cells."></canvas>
    <div class="speed">
      <label for="speed">Speed</label>
      <input id="speed" type="range" min="1" max="60" step="1" />
      <output for="speed"></output>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
